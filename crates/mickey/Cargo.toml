[package]
name = "mickey"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
mickey-config = { path = "../mickey-config" }
# Noise protocol for the secure link (PRD 0002). Only the primitives of
# Noise_XX_25519_ChaChaPoly_BLAKE2s are enabled.
snow = { version = "0.10", default-features = false, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom",
] }
# The system clipboard (PRD 0011): Wayland's data-control protocol (with
# X11 as the fallback) and Windows, text and images, behind one interface.
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# Images cross as PNG, several times smaller than raw pixels; already in
# the tree through arboard.
png = "0.18"

# The tray icon on Linux (PRD 0009): the StatusNotifierItem protocol over
# D-Bus, too large to write by hand. Without tokio: its blocking API runs on
# the small async-io executor, on a thread of its own.
# Shared audio on Windows (PRD 0012): WASAPI through `wasapi`, which also
# brings Microsoft's `windows` crate; that one only for the output's mute.
# Their COM interfaces by hand would be long and easy to get wrong.
[target.'cfg(windows)'.dependencies]
wasapi = "0.19"
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Hearing every copy on Wayland without reading the clipboard over and
# over (PRD 0011): the data-control protocol's selection events. Both are
# already in the tree through arboard.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Shared audio on Linux (PRD 0012): the sound server's own client library,
# libpulse, which PulseAudio and PipeWire both answer and every desktop
# has. Talking its protocol by hand would be far longer.
libpulse-binding = "2"
# Its blocking record and playback API (the same system library).
libpulse-simple-binding = "2"
# Reading the clipboard through GPaste on GNOME Wayland (#258), over the
# session D-Bus. Already in the tree through ksni; this adds only its
# blocking API.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# The Ratão icon inside the Windows .exe (build.rs): compiles a resource
# with the resource compiler the target uses (windres or rc.exe).
[build-dependencies]
embed-resource = "3"
