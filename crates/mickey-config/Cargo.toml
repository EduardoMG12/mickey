[package]
name = "mickey-config"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# config.toml and hotkey parsing, shared by `mickey` and the settings window
# in `mickey-ui`, so both apply exactly the same rules.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
