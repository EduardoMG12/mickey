[package]
name = "mickey-ui"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
mickey-config = { path = "../mickey-config" }
# The GUI lives in its own program so `mickey source`, which runs all day and
# holds the keyboard, never links it (spike #47: 90-125 MB while a window is
# open). Only what the switcher needs: OpenGL (glow), the built-in fonts, and
# both Linux display protocols.
# The mascot in the windows is a PNG; already in the tree through eframe.
png = "0.18"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }

# The Ratão icon inside the Windows .exe (build.rs): compiles a resource
# with the resource compiler the target uses (windres or rc.exe).
[build-dependencies]
embed-resource = "3"
