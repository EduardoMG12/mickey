[workspace]
members = ["crates/mickey", "crates/mickey-config", "crates/mickey-ui"]
resolver = "2"

# Dependencies (the cryptography in particular) are optimized even in debug
# builds: unoptimized ChaCha20 made one test 4x slower. Mickey's own code
# stays unoptimized, so the debugger still shows every variable.
[profile.dev.package."*"]
opt-level = 3
