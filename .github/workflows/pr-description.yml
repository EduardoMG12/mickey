name: PR description

# Fails when a PR's description leaves "Summary" or "How it was verified"
# empty (only the template's comments, or "n/a"). Editing the description
# runs it again, no new push needed.
#
# The description is someone else's text: it is read from the event file on
# disk, never put into a script through ${{ }}, and the job has no token.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  description:
    # Dependabot's PRs have their own format.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Summary and How it was verified are filled in
        shell: python
        run: |
          import json, os, re, sys

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          body = (event["pull_request"].get("body") or "").replace("\r\n", "\n")
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          parts = re.split(r"^##[ \t]+(.+?)[ \t]*$", body, flags=re.M)
          sections = {parts[i].strip().lower(): parts[i + 1] for i in range(1, len(parts), 2)}

          empty = []
          for name in ("Summary", "How it was verified"):
              text = sections.get(name.lower(), "")
              text = re.sub(r"^\s*(?:[-*]\s*(?:\[[ xX]\])?|\d+\.)\s*", "", text, flags=re.M).strip()
              if len(text) < 15 or text.lower().strip(".") in ("n/a", "na", "none", "tbd", "-"):
                  empty.append(name)

          for name in empty:
              print(f"::error::The section '## {name}' is missing or empty. Fill it in the PR description; editing it runs this check again.")
          if empty:
              sys.exit(1)
          print("The PR description has a Summary and says how it was verified.")
