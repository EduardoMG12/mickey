name: Release

# Builds the installers. On a version tag (v0.1.0, …) it also publishes them
# as a GitHub release; on pull requests that touch packaging it only builds
# them, so they can be downloaded from the run and tried.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  linux:
    # Built inside Ubuntu 22.04, whatever the runner: a binary needs the
    # glibc it was built against or newer, so this sets the minimum at 2.35
    # (Ubuntu 22.04, Mint 21, Debian 12, Fedora 36 or newer, #220). Built on
    # 24.04 it also asked, weakly, for 2.39 symbols, and 22.04 printed a
    # loader warning on every start. The container does not move on by itself.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Tools the container lacks
        run: apt-get update -qq && apt-get install -y -qq curl ca-certificates build-essential git binutils python3 >/dev/null
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --workspace --locked
      - name: Check the glibc they need
        # Every version a binary names, weak ones included: a weak one still
        # makes the loader warn on an older system.
        run: |
          for bin in target/release/mickey target/release/mickey-ui; do
            needs=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1)
            echo "$bin needs $needs"
            [ "$(printf '%s\nGLIBC_2.35\n' "$needs" | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "newer than the README's minimum (2.35)"; exit 1; }
          done
      - name: Pack
        run: |
          dir=mickey-linux-x86_64
          mkdir "$dir"
          cp target/release/mickey target/release/mickey-ui "$dir/"
          cp packaging/linux/* README.md LICENSE "$dir/"
          # The crates' own notices travel with the binaries.
          python3 tools/licenses/third_party_licenses.py x86_64-unknown-linux-gnu > "$dir/THIRD-PARTY-LICENSES.txt"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: mickey-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - run: cargo build --release --workspace --locked
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build the installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version=0.0.0-test ;; esac
          # A tag must match the version the programs report (Cargo.toml).
          cargo_version=$(grep -m1 '^version' crates/mickey/Cargo.toml | cut -d'"' -f2)
          case "$GITHUB_REF" in refs/tags/*) [ "$version" = "$cargo_version" ] || { echo "tag $version but Cargo.toml says $cargo_version"; exit 1; } ;; esac
          # Installed next to the programs (see mickey.nsi).
          cp LICENSE target/release/LICENSE.txt
          python tools/licenses/third_party_licenses.py x86_64-pc-windows-msvc > target/release/THIRD-PARTY-LICENSES.txt
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION="$version" \
            -DBIN="$GITHUB_WORKSPACE\\target\\release" packaging/windows/mickey.nsi
          mv packaging/windows/Mickey-Setup-*.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Mickey-Setup-*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checksums, so a download can be checked (sha256sum -c SHA256SUMS).
          cp linux/mickey-linux-x86_64.tar.gz windows/Mickey-Setup-*.exe .
          sha256sum mickey-linux-x86_64.tar.gz Mickey-Setup-*.exe > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Mickey $GITHUB_REF_NAME" --generate-notes \
            mickey-linux-x86_64.tar.gz Mickey-Setup-*.exe SHA256SUMS
