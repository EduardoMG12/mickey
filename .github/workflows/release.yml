name: Release

# Builds the installers. On a version tag (v0.1.0, …) it also publishes them
# as a GitHub release; on pull requests that touch packaging it only builds
# them, so they can be downloaded from the run and tried.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  linux:
    # Pinned: the glibc this image has is the oldest the binaries need
    # (2.39: Ubuntu 24.04, Mint 22, Fedora 40, Debian 13 or newer, #220).
    # ubuntu-latest moving on would raise that minimum without anyone noticing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --workspace
      - name: Check the glibc they need
        run: |
          for bin in target/release/mickey target/release/mickey-ui; do
            needs=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1)
            echo "$bin needs $needs"
            [ "$(printf '%s\nGLIBC_2.39\n' "$needs" | sort -V | tail -1)" = GLIBC_2.39 ] || { echo "newer than the README's minimum (2.39)"; exit 1; }
          done
      - name: Pack
        run: |
          dir=mickey-linux-x86_64
          mkdir "$dir"
          cp target/release/mickey target/release/mickey-ui "$dir/"
          cp packaging/linux/* README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: mickey-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - run: cargo build --release --workspace
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build the installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version=0.0.0-test ;; esac
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION="$version" \
            -DBIN="$GITHUB_WORKSPACE\\target\\release" packaging/windows/mickey.nsi
          mv packaging/windows/Mickey-Setup-*.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Mickey-Setup-*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checksums, so a download can be checked (sha256sum -c SHA256SUMS).
          cp linux/mickey-linux-x86_64.tar.gz windows/Mickey-Setup-*.exe .
          sha256sum mickey-linux-x86_64.tar.gz Mickey-Setup-*.exe > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Mickey $GITHUB_REF_NAME" --generate-notes \
            mickey-linux-x86_64.tar.gz Mickey-Setup-*.exe SHA256SUMS
